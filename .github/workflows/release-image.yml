name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

# The guard and the push are not atomic: two overlapping runs for the same
# tag (a manual re-run racing the original) can both pass the guard before
# either pushes, and the last one to finish wins. Serialize per ref instead
# of cancelling an in-flight release push.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # One .cdx.json per workspace member; the binary's (rustunifimcp.cdx.json)
      # is the one that matches what actually ships in the image.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: '**/*.cdx.json'
          retention-days: 90

  build-and-push:
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and the provenance attestation both exchange
      # this job's OIDC token for a short-lived identity; no key material is
      # stored anywhere. This workflow only ever runs from a version-tag push,
      # never a PR or an arbitrary branch, so a Rekor/attestation entry is
      # only ever created for a tagged release.
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need all tags to decide whether this is the newest stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag and check it matches Cargo
        id: version
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}

          # The image tag comes from the git ref; the binary inside carries
          # workspace.package.version. Nothing otherwise ties them together, so a
          # tag pushed before the version bump — or mistyped — would publish an
          # image labelled one version containing another. Fail before pushing.
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]$/ { in_wp = 1; next }
            /^\[/ { in_wp = 0 }
            in_wp && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          BASE=${VERSION%%-*}
          if [ "$BASE" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$VERSION disagrees with workspace.package.version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "tag v$VERSION matches Cargo version $CARGO_VERSION"

          # `latest` must not move to a prerelease, a backfilled older tag, or a
          # tag that this same check already rejected. A bogus `v3.0.0` pushed
          # against Cargo 0.3.0 fails above but still exists in git, and would
          # otherwise sort highest forever and freeze `latest`. So a tag only
          # counts if its own commit's Cargo version matches it.
          LATEST_STABLE=""
          for t in $(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | awk '!/-/' | sort -V); do
            # `|| true` matters: this step runs under `set -euo pipefail`, so a tag
            # pointing at a tree, a blob, or a commit with no Cargo.toml would make
            # git show fail, fail the pipeline, and abort the whole release step —
            # one malformed tag would then block every future release until deleted.
            # An unreadable manifest just means "not a valid release tag": skip it.
            tag_cargo=$(git show "$t:Cargo.toml" 2>/dev/null | awk '
              /^\[workspace\.package\]$/ { in_wp = 1; next }
              /^\[/ { in_wp = 0 }
              in_wp && /^version = / { gsub(/"/, "", $3); print $3; exit }
            ' || true)
            [ "${t#v}" = "$tag_cargo" ] && LATEST_STABLE="$t"
          done
          if [ "v$VERSION" = "$LATEST_STABLE" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "not tagging latest: newest stable is $LATEST_STABLE"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Refuse to republish an existing release tag
        # ghcr.io/<repo>:<version> is a moving tag: pushing to it again --
        # whether from a re-run of this workflow or a second tag push that
        # resolves to the same version -- would silently replace the image a
        # signed git tag once pointed to, with no version bump or new tag to
        # signal it. Treat the first successful push of a given version as
        # final; any later content for this repo ships under a new version.
        env:
          # Passed through env instead of templated into the script text: a
          # prerelease suffix only has its base validated above, so it can
          # still carry shell metacharacters that a tag-push actor controls.
          # Templating it straight into `run:` would make that text part of
          # the script bash parses; env keeps it a plain string.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for TAG in \
            "ghcr.io/${{ github.repository }}:${VERSION}" \
            "docker.io/mechub/rustunifimcp:${VERSION}"; do
            # A non-zero exit here is ambiguous: it covers both "the tag doesn't
            # exist yet" and transient failures (registry 5xx, rate limit,
            # network blip). Treating every non-zero exit as "not published"
            # would let a flaky check wave the push through -- the exact
            # overwrite this guard exists to stop. Only a confirmed "not
            # found"/"manifest unknown" response counts as unpublished; any
            # other error fails the job instead of guessing.
            if out=$(docker buildx imagetools inspect "$TAG" 2>&1); then
              echo "::error::$TAG was already published; cut a new version instead of republishing it" >&2
              exit 1
            elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
              echo "::error::could not determine whether $TAG exists: $out" >&2
              exit 1
            fi
            echo "$TAG not yet published, proceeding"
          done

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.version.outputs.sha }}
            ${{ steps.version.outputs.is_latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            docker.io/mechub/rustunifimcp:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_latest == 'true' && 'docker.io/mechub/rustunifimcp:latest' || '' }}
          labels: |
            org.opencontainers.image.title=rustunifimcp
            org.opencontainers.image.description=UniFi Network MCP server
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        # Sign by digest, not by the mutable tags above -- a tag can be
        # repointed later, but the digest is what was actually just pushed.
        # docker/build-push-action's digest output is the pushed image's
        # digest, so this one signature covers what was published.
        run: cosign sign --yes "ghcr.io/${REPO}@${DIGEST}"
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Sign image (keyless) -- Docker Hub
        # Same digest as the GHCR signature above, but cosign writes the
        # signature into whichever registry it's pointed at, so Docker Hub
        # needs its own signing call even though it's the same image bits.
        run: cosign sign --yes "docker.io/mechub/rustunifimcp@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Attest build provenance -- GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance -- Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/mechub/rustunifimcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx

      # Binds the SBOM to the image digest as a signed attestation instead of
      # a plain workflow-run artifact, so it doesn't expire and travels with
      # the image rather than needing to be found separately.
      - name: Attest SBOM -- GHCR
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: rustunifimcp/rustunifimcp.cdx.json
          push-to-registry: true

      - name: Attest SBOM -- Docker Hub
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/mechub/rustunifimcp
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: rustunifimcp/rustunifimcp.cdx.json
          push-to-registry: true
