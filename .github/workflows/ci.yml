name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  container-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify container argv
        run: |
          docker build -t rustunifimcp:ci .

          # Regression guard for mecmcp#357: config paths must survive operator overrides.
          # Docker replaces CMD entirely when the caller supplies args, but appends to
          # ENTRYPOINT, so config paths must live in ENTRYPOINT or they vanish the
          # moment anyone passes --host.
          container_id=$(docker create rustunifimcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null

          for p in /etc/unifimcp/controllers.json /var/lib/unifimcp/tokens.json /var/lib/unifimcp/changesets.json; do
            echo "$argv" | grep -q -- "$p" || { echo "FAIL: $p missing from argv with --host override"; exit 1; }
          done
          echo "PASS: config paths survive --host override"

  conformance:
    name: Package conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the release binary
        run: cargo build --release --locked --bin rustunifimcp

      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          cp target/release/rustunifimcp staging/bin/
          cp -r packaging staging/packaging
          cp packaging/conformance.toml staging/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: rustunifimcp:ci
          cache-from: type=gha,scope=ci-conformance
          cache-to: type=gha,scope=ci-conformance,mode=max

      - name: Conformance
        uses: mechubsec/mecmcp/packaging/conformance@927361a755ceb5a43289275ab5f5f00d66359cc3
        with:
          staging: staging
          manifest: staging/conformance.toml
          image: rustunifimcp:ci
