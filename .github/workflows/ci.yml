name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  container-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify container argv
        run: |
          docker build -t rustunifimcp:ci .

          # Regression guard for mecmcp#357: config paths must survive operator overrides.
          # Docker replaces CMD entirely when the caller supplies args, but appends to
          # ENTRYPOINT, so config paths must live in ENTRYPOINT or they vanish the
          # moment anyone passes --host.
          container_id=$(docker create rustunifimcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null

          # Also covers mecmcp#376 / MEC-978: the audit HMAC key path must
          # survive an operator override the same way the other config paths
          # do, or the image ships keyless audit the moment anyone passes
          # --host.
          for p in /etc/unifimcp/controllers.json /var/lib/unifimcp/tokens.json /var/lib/unifimcp/changesets.json /var/lib/unifimcp/audit-hmac.key; do
            echo "$argv" | grep -q -- "$p" || { echo "FAIL: $p missing from argv with --host override"; exit 1; }
          done
          echo "PASS: config paths survive --host override"
