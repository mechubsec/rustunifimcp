[package]
name = "rustunifimcp"
description = "Enterprise MCP server for UniFi Network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustunifimcp-core.workspace = true
mecmcp-audit.workspace = true
mecmcp-auth.workspace = true
mecmcp-changeset.workspace = true
mecmcp-http.workspace = true
mecmcp-runtime.workspace = true
mecmcp-secret.workspace = true
mecmcp-server.workspace = true
mecmcp-transport.workspace = true
rmcp.workspace = true
schemars.workspace = true
anyhow.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen.workspace = true
rmcp = { workspace = true, features = ["client"] }
tempfile = "3"
# Test-only: the HTTP integration test drives the real router with
# `mecmcp_transport::test_harness::serve_on_loopback`. mecmcp 0.24.0 (#387)
# moved that behind this feature and dropped its `ureq` dependency from the
# normal (non-test-util) dependency graph.
mecmcp-transport = { workspace = true, features = ["test-util"] }
# Test-only: the shared CLI refusal fixtures live behind `test-util`.
mecmcp-runtime = { workspace = true, features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Test-only: the redaction sweep (tests/redaction_sweep.rs) stands up a mock
# UniFi controller over a real TLS listener rather than asserting on
# constructed `Value`s, so a tool that bypasses the redaction path by
# fetching data some other way still gets caught.
axum.workspace = true
axum-server.workspace = true

[lints]
workspace = true
